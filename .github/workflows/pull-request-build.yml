name: Pull Request Voter

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

env:
  MAVEN_VERSION: '3.9.15'

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    types: [reopened, synchronize, opened]

jobs:
  blackduck:
    name: Blackduck Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Scan With Black Duck
        uses: cap-java/.github/actions/scan-with-blackduck@296573b55e906f5c77a1855bcfe4285cbbc5cac4 # main
        with:
          blackduck_token: ${{ secrets.BLACK_DUCK_TOKEN }}
          maven-version: ${{ env.MAVEN_VERSION }}
          project-name: com.sap.cds.feature.auditlog-ng
          included-modules: cds-feature-auditlog-ng
          scan_mode: RAPID
          rapid_compare_mode: BOM_COMPARE # PRs might only be blocked by things they introduce, not by pre-existing issues that could have appeared in the main branch in the meantime

  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [ 17, 21 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        uses: cap-java/cds-feature-auditlog-ng/.github/actions/build@296573b55e906f5c77a1855bcfe4285cbbc5cac4 # main
        with:
          java-version: ${{ matrix.java-version }}
          maven-version: ${{ env.MAVEN_VERSION }}

      #- name: SonarQube Scan
      #  uses: cap-java/cds-feature-auditlog-ng/.github/actions/scan-with-sonar@296573b55e906f5c77a1855bcfe4285cbbc5cac4 # main
      #  if: ${{ matrix.java-version == 17 }}
      #  with:
      #    java-version: ${{ matrix.java-version }}
      #    maven-version: ${{ env.MAVEN_VERSION }}
      #    sonarq-token: ${{ secrets.SONARQ_TOKEN }}
      #    github-token: ${{ secrets.GITHUB_TOKEN }}
